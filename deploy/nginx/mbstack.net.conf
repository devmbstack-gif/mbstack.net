server {
    listen 80;
    server_name mbstack.net www.mbstack.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mbstack.net www.mbstack.net;

    ssl_certificate     /www/server/panel/vhost/cert/mbstack.net/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mbstack.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location ^~ /.well-known/ {
        root /www/wwwroot/mbstack.net;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/mbstack.net.log;
    error_log /www/wwwlogs/mbstack.net.error.log;
}
